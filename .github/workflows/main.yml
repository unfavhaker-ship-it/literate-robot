name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 360

    env:
      RDP_USERNAME: RDPAdmin47
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}

    steps:

      - name: Configure RDP
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1 `
            -Force

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Restart-Service TermService -Force

      - name: Create RDP User
        shell: powershell
        run: |
          $username = $env:RDP_USERNAME
          $password = $env:RDP_PASSWORD

          if ([string]::IsNullOrWhiteSpace($password)) {
              throw "RDP_PASSWORD GitHub Secret is missing."
          }

          $securePass = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $existing = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($existing) {
              Set-LocalUser `
                -Name $username `
                -Password $securePass
          }
          else {
              New-LocalUser `
                -Name $username `
                -Password $securePass `
                -AccountNeverExpires
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Write-Host "================================="
          Write-Host "RDP USER: $username"
          Write-Host "RDP PASSWORD: GitHub Secret RDP_PASSWORD"
          Write-Host "================================="

      - name: Install Tailscale
        shell: powershell
        run: |
          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $installer

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait

      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
              throw "TAILSCALE_AUTH_KEY GitHub Secret is missing."
          }

          & "C:\Program Files\Tailscale\tailscale.exe" up `
            --authkey="$env:TAILSCALE_AUTH_KEY"

          Write-Host "Tailscale status:"
          & "C:\Program Files\Tailscale\tailscale.exe" status

      - name: Keep Alive
        shell: powershell
        run: |
          Write-Host "RDP session is running."
          Write-Host "Username: $env:RDP_USERNAME"
          Write-Host "Password: stored in GitHub Secret RDP_PASSWORD"

          while ($true) {
              Start-Sleep -Seconds 300
          }
