name: Windows RDP with Tailscale

on:
  workflow_dispatch:

jobs:
  windows-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Configure Windows RDP
        shell: pwsh
        run: |
          Write-Host "Checking Windows Remote Desktop configuration..."

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Write-Host "RDP settings configured."

      - name: Install Tailscale
        shell: pwsh
        run: |
          $installer = "$env:TEMP\tailscale-setup.exe"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" `
            -OutFile $installer

          Start-Process `
            -FilePath $installer `
            -ArgumentList "/quiet" `
            -Wait

      - name: Connect Tailscale
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (!(Test-Path $tailscale)) {
            throw "Tailscale installation failed."
          }

          & $tailscale up --authkey="$env:TS_AUTHKEY" --hostname="github-windows-runner"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed."
          }

          & $tailscale ip -4

      - name: Keep Runner Active
        shell: pwsh
        run: |
          while ($true) {
            Write-Host "Windows runner is active."
            Start-Sleep -Seconds 60
          }
